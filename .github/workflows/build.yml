name: Build

on:
  push:
    branches:
      - "3.x"
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 21
          cache: 'maven'
          distribution: 'temurin'

      - name: Build, test, and install extension
        run: mvn -B -ntp clean formatter:validate install

      - name: Test consumer on Quarkus 3
        run: mvn -B -ntp -f consumer-tests/pom.xml -Dquarkus.version=3.40.1 clean test
