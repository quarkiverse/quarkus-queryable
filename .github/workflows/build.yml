name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '*.adoc'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*.adoc'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        quarkus-version: ["3.39.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build extension
        run: mvn -B -Dquarkus.version=${{ matrix.quarkus-version }} clean install
      - name: Test standalone consumer
        run: mvn -B -f consumer-tests/pom.xml -Dquarkus.version=${{ matrix.quarkus-version }} clean test
